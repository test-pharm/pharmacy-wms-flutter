name: Flutter CI/CD

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "AGENTS.md"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    permissions:
      contents: write
    name: Build & Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"
          cache: true

      - name: Auto-bump version
        id: bump
        shell: powershell
        run: |
          $json = Get-Content version.json -Raw | ConvertFrom-Json
          $parts = $json.latestVersion -split '\.'
          $patch = [int]$parts[2] + 1
          $newVersion = "$($parts[0]).$($parts[1]).$patch"
          $newBuild = $json.latestBuildNumber + 1

          Write-Output "Bumping from v$($json.latestVersion) (build $($json.latestBuildNumber)) to v$newVersion (build $newBuild)"

          $json.latestVersion = $newVersion
          $json.latestBuildNumber = $newBuild
          $json | ConvertTo-Json -Depth 10 | Set-Content version.json
          $json | ConvertTo-Json -Depth 10 | Set-Content assets/version.json

          $pubspec = Get-Content pubspec.yaml -Raw
          $pubspec = $pubspec -replace '(?<=^version: ).+', "$newVersion+$newBuild"
          $pubspec | Set-Content pubspec.yaml

          "newVersion=$newVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "newBuild=$newBuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - run: flutter pub get
      - run: flutter analyze
        continue-on-error: true
      - run: flutter config --enable-windows-desktop
      - run: flutter build windows --release

      - name: Bundle runtime DLLs and zip
        shell: powershell
        run: |
          $relPath = if (Test-Path "build\windows\runner\Release") { "build\windows\runner\Release" } else { "build\windows\x64\runner\Release" }
          # Find and copy required VC++ runtime DLLs
          $dlls = @("vcruntime140.dll","vcruntime140_1.dll","msvcp140.dll","msvcp140_1.dll","msvcp140_2.dll")
          # Search order: VS redist dir, System32, SysWOW64
          $searchDirs = @()
          $vsRoot = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise"
          $redistRoot = "$vsRoot\VC\Redist\MSVC"
          if (Test-Path $redistRoot) {
            $searchDirs += Get-ChildItem "$redistRoot\*\x64\Microsoft.VC*.CRT" | Select-Object -ExpandProperty FullName
          }
          $searchDirs += "C:\Windows\System32"
          $dlls | ForEach-Object {
            $found = $null
            foreach ($dir in $searchDirs) {
              $p = Join-Path $dir $_
              if (Test-Path $p) { $found = $p; break }
            }
            if ($found) { Copy-Item $found "$relPath\$_" }
          }
          Compress-Archive -Path "$relPath\*" -DestinationPath pharmacy-wms-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.newVersion }}
          name: v${{ steps.bump.outputs.newVersion }}
          files: pharmacy-wms-windows.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json assets/version.json pubspec.yaml
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Auto-bump to v${{ steps.bump.outputs.newVersion }} [skip ci]"
          git push origin main
